name: Window controls
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies in disposable CI VM
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-shadertools-dev qt6-5compat-dev qtkeychain-qt6-dev libqrencode-dev libtag1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Check pinned components and build
        run: |
          python3 tools/vendor_components.py --check
          cmake -S . -B build/window -G Ninja -DCMAKE_BUILD_TYPE=Release -DKMUSIC_BUILD_WINDOW_TESTS=ON
          cmake --build build/window --parallel 2
      - name: Check takeover, layout preservation and fallback
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/window --output-on-failure
